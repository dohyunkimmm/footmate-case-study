name: Inspect three FootMate slides
on:
  push:
    branches:
      - feat/three-slide-readability-20261111
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-pptx
      - run: python qa/inspect-three-slides-20261111.py
