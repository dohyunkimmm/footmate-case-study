name: One-time strategy PPTX wording alignment
on:
  push:
    branches: [fix/align-presentation-report-copy-20261117]
permissions:
  contents: write
concurrency:
  group: footmate-strategy-pptx-alignment-20261117
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip aligned PPTX]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install slide editing package
        run: python -m pip install --disable-pip-version-check python-pptx==1.0.2
      - name: Synchronize editable six-slide PPTX from website text
        run: python qa/sync-strategy-brief-pptx.py
      - name: Verify editable PPTX and website text match
        run: python qa/check-strategy-brief.py
      - name: Commit refreshed PPTX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_strategy_p0_p2.pptx
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh six-slide editorial copy [skip aligned PPTX]"
            git push origin HEAD:fix/align-presentation-report-copy-20261117
          fi
