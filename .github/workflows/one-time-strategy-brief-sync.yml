name: One-time FootMate Strategy PPTX Sync
on:
  push:
    branches: [feature/predeploy-p0-p2-site-deck-20261116]
permissions:
  contents: write
concurrency:
  group: footmate-one-time-strategy-sync
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip strategy sync]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editable presentation tools
        run: python -m pip install --disable-pip-version-check python-pptx==1.0.2
      - name: Sync six editable slides from one source
        run: python qa/sync-strategy-brief-pptx.py
      - name: Validate editable slide ZIP and source parity
        run: python qa/check-strategy-brief.py
      - name: Publish the PPTX only to this review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_strategy_p0_p2.pptx
          if ! git diff --cached --quiet; then
            git commit -m "build: sync edited P0–P2 PPTX to approved copy [skip strategy sync]"
            git push origin HEAD:feature/predeploy-p0-p2-site-deck-20261116
          fi
