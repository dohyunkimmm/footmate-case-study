name: One-time strategy editorial PPTX sync
on:
  push:
    branches: [fix/editorial-alignment-strategy-20261117]
permissions:
  contents: write
concurrency:
  group: strategy-editorial-sync-20261117
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip strategy sync]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PowerPoint editor
        run: python -m pip install --disable-pip-version-check python-pptx==1.0.2
      - name: Rewrite existing editable six-slide PPTX from canonical web copy
        run: python qa/sync-strategy-brief-pptx.py
      - name: Verify PPTX and public website copy
        run: python qa/check-strategy-brief.py
      - name: Commit editable PPTX to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_strategy_p0_p2.pptx
          if ! git diff --cached --quiet; then
            git commit -m "build: sync edited six-slide strategy deck [skip strategy sync]"
            git push origin HEAD:fix/editorial-alignment-strategy-20261117
          fi
