name: One-time final strategy deck copy sync
on:
  push:
    branches: [fix/remove-redundant-caveat-copy-20261117]
permissions:
  contents: write
concurrency:
  group: strategy-final-copy-sync-20261117
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip final copy sync]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PowerPoint editor
        run: python -m pip install --disable-pip-version-check python-pptx==1.0.2
      - name: Regenerate existing editable six-slide PPTX from current website copy
        run: python qa/sync-strategy-brief-pptx.py
      - name: Verify PPTX matches web copy and revised page has no duplicated captions
        run: python qa/check-strategy-brief.py
      - name: Commit refreshed editable PPTX to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_strategy_p0_p2.pptx
          if ! git diff --cached --quiet; then
            git commit -m "build: sync final business strategy deck text [skip final copy sync]"
            git push origin HEAD:fix/remove-redundant-caveat-copy-20261117
          fi
