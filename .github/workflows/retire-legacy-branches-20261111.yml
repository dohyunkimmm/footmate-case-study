# One-time audit. Do not schedule periodic deletion of arbitrary branches.
name: Retire reviewed FootMate historical branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-legacy-branches-20261111.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: footmate-historical-ref-cleanup
  cancel-in-progress: false
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight every branch, archive all exact SHA tags, retire only verified refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          main="$(gh api "$api/git/ref/heads/main" --jq .object.sha)"
          [[ "$main" == "$GITHUB_SHA" ]] || { echo "::error::main moved since the audit"; exit 1; }
          open="$(gh api "$api/pulls?state=open&per_page=100")"
          [[ "$(jq length <<< "$open")" -lt 100 ]] || { echo "::error::Open PR list may be incomplete"; exit 1; }
          mapfile -t rows <<'MANIFEST'
          4|design-unified-web-and-decks-20261111|3ff88ef62dcfe3dc8e53e590d3dfc872685c482a|merged
          13|docs/main-inventory-sync-20261111|3ae09b4c7f1197f11848e8b85815bb017bc24f0d|merged
          3|docs/preserve-legacy-report-scripts-20261111|9c349467f79794a4fa7c3271b3de5cb060709531|merged
          12|feat/three-slide-readability-20261111|41640449b2c0485c0a2226f81e8cfb086c1b1ed1|merged
          10|fix/case-study-rhythm-copy-qa-20261111|6084fe7b115c1b1a7e4e23f3fde3f22d96193e50|merged
          5|fix/final-slide-qa-nine-slides-20261111|6a0c769a9678cd531c2a31470e8592ebb553db3e|merged
          11|fix/presentation-typography-20261111|d81f5f3f61ebb0f93276f437333dcab7fcafc38e|merged
          1|fix/report-demo-external-20261111|7863c9d0a4c0a5ded2353dff239838e7fac250a6|merged
          6|fix/sidebar-and-section-heading-spacing-20261111|cdd78c10cce04a18c2730065e37c4b4577bb5d36|merged
          9|fix/sidebar-bottom-gap-20261111-v2|98f8ec0aa07bd3df955e661b3b361097dc26bb62|merged
          7|fix/sidebar-header-spacing-20261111|8ca0b42fa5f37684aefcbc4445d833dc034ce7da|duplicate
          8|fix/spacing-stylesheet-cache-20261111|f0e32aea1699d21a8140fd037da0fc0582f134ec|merged
          2|qa/standalone-case-study-tests-20261111|c1947ef93e53e668d207414c12f734e6235e5a0a|merged
          MANIFEST
          # Preflight ALL rows before creating tags or deleting any refs.
          for row in "${rows[@]}"; do
            IFS='|' read -r number name sha mode <<< "$row"
            [[ "$name" != main && "$sha" =~ ^[0-9a-f]{40}$ && "$number" =~ ^[0-9]+$ ]] || exit 1
            pr="$(gh api "$api/pulls/$number")"
            jq -e --arg b "$name" --arg s "$sha" --arg repo "$GITHUB_REPOSITORY" --arg mode "$mode" \
              '.state=="closed" and .head.ref==$b and .head.sha==$s and .head.repo.full_name==$repo and .base.ref=="main" and (if $mode == "merged" then .merged==true else .merged==false end)' <<< "$pr" >/dev/null || exit 1
            if [[ "$mode" == duplicate ]]; then
              jq -e '(.body // "" | contains("중복")) and .merged==false' <<< "$pr" >/dev/null || exit 1
              gh api "$api/pulls/6" --jq .merged | grep -qx true || exit 1
            fi
            if jq -e --arg b "$name" 'any(.[]; .head.ref==$b)' <<< "$open" >/dev/null; then
              echo "::error::Open PR still uses $name"; exit 1
            fi
            tag="archive/20261111/reviewed/pr-$number/$name"
            tag_json="$(gh api "$api/git/ref/tags/$tag" 2>/dev/null || true)"
            tagged="$(jq -r --arg ref "refs/tags/$tag" 'if type=="object" and .ref==$ref then (.object.sha // "") else "" end' <<< "${tag_json:-null}" 2>/dev/null || true)"
            [[ -z "$tagged" || "$tagged" == "$sha" ]] || { echo "::error::Archive tag $tag points to unexpected SHA: $tagged"; exit 1; }
            branch_json="$(gh api "$api/git/ref/heads/$name" 2>/dev/null || true)"
            branchsha="$(jq -r --arg ref "refs/heads/$name" 'if type=="object" and .ref==$ref then (.object.sha // "") else "" end' <<< "${branch_json:-null}" 2>/dev/null || true)"
            [[ "$branchsha" == "$sha" || ( -z "$branchsha" && "$tagged" == "$sha" ) ]] || { echo "::error::Branch SHA mismatch $name"; exit 1; }
            echo "VERIFIED PR #$number $name"
          done
          # Create and verify ALL immutable recovery pointers first.
          for row in "${rows[@]}"; do
            IFS='|' read -r number name sha mode <<< "$row"
            tag="archive/20261111/reviewed/pr-$number/$name"
            if ! gh api "$api/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X POST "$api/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            [[ "$(gh api "$api/git/ref/tags/$tag" --jq .object.sha)" == "$sha" ]] || exit 1
          done
          # Exact-SHA lease and open-PR check immediately precede deletion.
          for row in "${rows[@]}"; do
            IFS='|' read -r number name sha mode <<< "$row"
            actual_json="$(gh api "$api/git/ref/heads/$name" 2>/dev/null || true)"
            actual="$(jq -r --arg ref "refs/heads/$name" 'if type=="object" and .ref==$ref then (.object.sha // "") else "" end' <<< "${actual_json:-null}" 2>/dev/null || true)"
            if [[ -n "$actual" ]]; then
              [[ "$actual" == "$sha" ]] || exit 1
              now_open="$(gh api "$api/pulls?state=open&per_page=100")"
              [[ "$(jq length <<< "$now_open")" -lt 100 ]] || exit 1
              if jq -e --arg b "$name" 'any(.[]; .head.ref==$b)' <<< "$now_open" >/dev/null; then exit 1; fi
              gh api -X DELETE "$api/git/refs/heads/$name" >/dev/null
            fi
            if gh api "$api/git/ref/heads/$name" >/dev/null 2>&1; then exit 1; fi
            echo "RETIRED #$number $name (tag preserved)"
          done
          echo "PASS: all 13 reviewed branches archived before removal; main untouched"
